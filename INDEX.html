<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sistema de Registro de Lotes - Firestore</title>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDKY8xXjNwK2-QD3_A12f6hNCDOxfVt2wk",
            authDomain: "noticias-gzl.firebaseapp.com",
            databaseURL: "https://noticias-gzl-default-rtdb.firebaseio.com",
            projectId: "noticias-gzl",
            storageBucket: "noticias-gzl.firebasestorage.app",
            messagingSenderId: "10073993896",
            appId: "1:10073993896:web:a4eb1e27cc4a1753a4889d",
            measurementId: "G-2GTG7VPN44"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Tornar db disponível globalmente
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.serverTimestamp = serverTimestamp;
        
        console.log("Firebase inicializado com sucesso!");
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        select, input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .mode-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
        }

        .manual-mode, .reader-mode {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .manual-mode.active, .reader-mode.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lote-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .lote-input-group input {
            flex: 1;
        }

        .lote-input-group button {
            padding: 12px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .lote-input-group button:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .lote-list {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .lote-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: white;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .lote-item span {
            font-family: monospace;
            font-size: 14px;
        }

        .remove-lote {
            background: #dc3545;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .remove-lote:hover {
            background: #c82333;
        }

        .btn-save {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-save:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .stats {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        @media (max-width: 600px) {
            .content {
                padding: 20px;
            }
            
            .mode-buttons {
                flex-direction: column;
            }
            
            .lote-input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Sistema de Registro de Lotes</h1>
            <p>Selecione a máquina e o modo de entrada dos lotes</p>
        </div>
        
        <div class="content">
            <!-- Seleção da Máquina -->
            <div class="form-group">
                <label>🤖 Selecione a Máquina:</label>
                <select id="machineSelect">
                    <option value="mp4">MP4</option>
                    <option value="mp7">MP7</option>
                    <option value="mp8">MP8</option>
                    <option value="mp9">MP9</option>
                </select>
            </div>
            
            <!-- Botões de Modo -->
            <div class="mode-buttons">
                <div class="mode-btn active" data-mode="manual">✍️ Modo Manual</div>
                <div class="mode-btn" data-mode="reader">📡 Leitor de Lote</div>
            </div>
            
            <!-- Modo Manual -->
            <div id="manualMode" class="manual-mode active">
                <div class="form-group">
                    <label>🔢 Digite o Número do Lote:</label>
                    <div class="lote-input-group">
                        <input type="text" id="manualLote" placeholder="Ex: LOTE001, 12345, ABC123" autocomplete="off">
                        <button id="addManualLoteBtn">➕ Adicionar</button>
                    </div>
                </div>
                <div id="manualLoteList" class="lote-list">
                    <div style="text-align: center; color: #999;">Nenhum lote adicionado</div>
                </div>
            </div>
            
            <!-- Modo Leitor -->
            <div id="readerMode" class="reader-mode">
                <div class="form-group">
                    <label>📷 Leia os Lotes (um por linha):</label>
                    <textarea id="readerLotes" rows="5" placeholder="Cole ou leia os lotes aqui&#10;Ex:&#10;LOTE001&#10;LOTE002&#10;LOTE003" autocomplete="off"></textarea>
                    <button id="validateReaderBtn" style="margin-top: 10px; width: 100%; padding: 10px; background: #17a2b8; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600;">✅ Validar e Adicionar Lotes</button>
                </div>
                <div id="readerLoteList" class="lote-list">
                    <div style="text-align: center; color: #999;">Nenhum lote validado</div>
                </div>
            </div>
            
            <!-- Botão Salvar -->
            <button id="saveBtn" class="btn-save">💾 Salvar no Banco de Dados</button>
            
            <!-- Mensagem de Status -->
            <div id="message" class="message"></div>
            
            <!-- Estatísticas -->
            <div class="stats" id="stats">
                Total de lotes a salvar: 0
            </div>
        </div>
    </div>

    <script type="module">
        // Estado da aplicação
        let currentMachine = 'mp4';
        let currentMode = 'manual';
        let manualLotes = [];
        let readerLotes = [];
        
        // Elementos DOM
        const machineSelect = document.getElementById('machineSelect');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const manualModeDiv = document.getElementById('manualMode');
        const readerModeDiv = document.getElementById('readerMode');
        const manualLoteInput = document.getElementById('manualLote');
        const addManualLoteBtn = document.getElementById('addManualLoteBtn');
        const manualLoteListDiv = document.getElementById('manualLoteList');
        const readerLotesTextarea = document.getElementById('readerLotes');
        const validateReaderBtn = document.getElementById('validateReaderBtn');
        const readerLoteListDiv = document.getElementById('readerLoteList');
        const saveBtn = document.getElementById('saveBtn');
        const messageDiv = document.getElementById('message');
        const statsDiv = document.getElementById('stats');
        
        // Função para mostrar mensagem
        function showMessage(text, type = 'info') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }
        
        // Função para atualizar estatísticas
        function updateStats() {
            const totalLotes = currentMode === 'manual' ? manualLotes.length : readerLotes.length;
            statsDiv.textContent = `Total de lotes a salvar: ${totalLotes}`;
            
            // Habilitar/desabilitar botão salvar
            saveBtn.disabled = totalLotes === 0;
        }
        
        // Função para renderizar lista de lotes do modo manual
        function renderManualLotes() {
            if (manualLotes.length === 0) {
                manualLoteListDiv.innerHTML = '<div style="text-align: center; color: #999;">Nenhum lote adicionado</div>';
                return;
            }
            
            manualLoteListDiv.innerHTML = manualLotes.map((lote, index) => `
                <div class="lote-item">
                    <span>📦 ${lote}</span>
                    <button class="remove-lote" data-index="${index}" data-mode="manual">Remover</button>
                </div>
            `).join('');
            
            // Adicionar eventos de remoção
            document.querySelectorAll('#manualLoteList .remove-lote').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(btn.dataset.index);
                    manualLotes.splice(index, 1);
                    renderManualLotes();
                    updateStats();
                    showMessage('Lote removido com sucesso!', 'info');
                });
            });
        }
        
        // Função para renderizar lista de lotes do modo leitor
        function renderReaderLotes() {
            if (readerLotes.length === 0) {
                readerLoteListDiv.innerHTML = '<div style="text-align: center; color: #999;">Nenhum lote validado</div>';
                return;
            }
            
            readerLoteListDiv.innerHTML = readerLotes.map((lote, index) => `
                <div class="lote-item">
                    <span>📦 ${lote}</span>
                    <button class="remove-lote" data-index="${index}" data-mode="reader">Remover</button>
                </div>
            `).join('');
            
            // Adicionar eventos de remoção
            document.querySelectorAll('#readerLoteList .remove-lote').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(btn.dataset.index);
                    readerLotes.splice(index, 1);
                    renderReaderLotes();
                    updateStats();
                    showMessage('Lote removido com sucesso!', 'info');
                });
            });
        }
        
        // Modo Manual: Adicionar lote
        addManualLoteBtn.addEventListener('click', () => {
            const lote = manualLoteInput.value.trim();
            
            if (!lote) {
                showMessage('Por favor, digite um número de lote!', 'error');
                return;
            }
            
            // Adicionar lote (permite lotes iguais)
            manualLotes.push(lote);
            renderManualLotes();
            updateStats();
            manualLoteInput.value = '';
            manualLoteInput.focus();
            showMessage(`Lote "${lote}" adicionado com sucesso!`, 'success');
        });
        
        // Permitir adicionar com Enter no campo manual
        manualLoteInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addManualLoteBtn.click();
            }
        });
        
        // Modo Leitor: Validar e adicionar lotes
        validateReaderBtn.addEventListener('click', () => {
            const text = readerLotesTextarea.value.trim();
            
            if (!text) {
                showMessage('Por favor, insira os lotes no campo de texto!', 'error');
                return;
            }
            
            // Separar por linhas e remover linhas vazias
            let lotes = text.split('\n')
                .map(line => line.trim())
                .filter(line => line !== '');
            
            if (lotes.length === 0) {
                showMessage('Nenhum lote válido encontrado!', 'error');
                return;
            }
            
            // Validar lotes (não pode ser vazio)
            const invalidLotes = lotes.filter(lote => lote === '');
            if (invalidLotes.length > 0) {
                showMessage(`${invalidLotes.length} lote(s) inválido(s) encontrado(s) e foram ignorados!`, 'error');
                lotes = lotes.filter(lote => lote !== '');
            }
            
            // Adicionar todos os lotes (permitindo duplicatas)
            const novosLotes = [...lotes];
            readerLotes.push(...novosLotes);
            renderReaderLotes();
            updateStats();
            readerLotesTextarea.value = '';
            showMessage(`${novosLotes.length} lote(s) validado(s) e adicionado(s) com sucesso!`, 'success');
        });
        
        // Função para salvar no Firestore
        async function saveToFirestore() {
            const machine = currentMachine;
            const lotes = currentMode === 'manual' ? [...manualLotes] : [...readerLotes];
            
            if (lotes.length === 0) {
                showMessage('Nenhum lote para salvar!', 'error');
                return;
            }
            
            // Desabilitar botão durante salvamento
            saveBtn.disabled = true;
            saveBtn.textContent = '💾 Salvando...';
            
            try {
                const db = window.db;
                const collection = window.collection;
                const addDoc = window.addDoc;
                const serverTimestamp = window.serverTimestamp;
                
                const resultados = [];
                const erros = [];
                
                // Salvar cada lote individualmente
                for (let i = 0; i < lotes.length; i++) {
                    const lote = lotes[i];
                    try {
                        const docRef = await addDoc(collection(db, "lotes"), {
                            maquina: machine,
                            lote: lote,
                            modo: currentMode === 'manual' ? 'manual' : 'leitor',
                            dataHora: serverTimestamp(),
                            timestamp: new Date().toISOString()
                        });
                        resultados.push(lote);
                        console.log(`Lote ${lote} salvo com ID:`, docRef.id);
                    } catch (error) {
                        console.error(`Erro ao salvar lote ${lote}:`, error);
                        erros.push(lote);
                    }
                }
                
                if (erros.length === 0) {
                    showMessage(`✅ ${resultados.length} lote(s) salvos com sucesso no Firestore!`, 'success');
                    
                    // Limpar listas após salvar
                    if (currentMode === 'manual') {
                        manualLotes = [];
                        renderManualLotes();
                    } else {
                        readerLotes = [];
                        renderReaderLotes();
                    }
                    updateStats();
                } else {
                    showMessage(`⚠️ ${resultados.length} lote(s) salvos, ${erros.length} falharam. Verifique o console.`, 'error');
                }
                
            } catch (error) {
                console.error('Erro ao salvar no Firestore:', error);
                showMessage(`Erro ao salvar no banco de dados: ${error.message}`, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 Salvar no Banco de Dados';
            }
        }
        
        // Evento do botão salvar
        saveBtn.addEventListener('click', saveToFirestore);
        
        // Evento de mudança de máquina
        machineSelect.addEventListener('change', (e) => {
            currentMachine = e.target.value;
            showMessage(`Máquina alterada para: ${currentMachine.toUpperCase()}`, 'info');
        });
        
        // Evento de mudança de modo
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const mode = btn.dataset.mode;
                currentMode = mode;
                
                // Atualizar UI dos botões
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // Mostrar modo correto
                if (mode === 'manual') {
                    manualModeDiv.classList.add('active');
                    readerModeDiv.classList.remove('active');
                } else {
                    manualModeDiv.classList.remove('active');
                    readerModeDiv.classList.add('active');
                }
                
                updateStats();
                showMessage(`Modo ${mode === 'manual' ? 'Manual' : 'Leitor'} ativado`, 'info');
            });
        });
        
        // Adicionar suporte para leitor USB (simular leitura com Enter)
        // No modo leitor, podemos capturar leituras sequenciais
        let readerBuffer = '';
        let lastKeyTime = 0;
        
        document.addEventListener('keydown', (e) => {
            if (currentMode === 'reader') {
                const now = Date.now();
                // Se for Enter e tiver buffer, adiciona o lote
                if (e.key === 'Enter' && readerBuffer.trim()) {
                    e.preventDefault();
                    const lote = readerBuffer.trim();
                    readerLotes.push(lote);
                    renderReaderLotes();
                    updateStats();
                    showMessage(`Lote "${lote}" lido com sucesso!`, 'success');
                    readerBuffer = '';
                } 
                // Se for tecla normal, adiciona ao buffer
                else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
                    // Verifica se é uma leitura rápida de leitor (menos de 50ms entre teclas)
                    if (now - lastKeyTime < 50 || readerBuffer.length > 0) {
                        readerBuffer += e.key;
                    } else {
                        readerBuffer = e.key;
                    }
                    lastKeyTime = now;
                    
                    // Timeout para limpar buffer se demorar muito
                    clearTimeout(window.readerTimeout);
                    window.readerTimeout = setTimeout(() => {
                        if (readerBuffer && !e.key === 'Enter') {
                            // Se tiver buffer e não for Enter, pode ser leitura manual
                            console.log('Buffer limpo:', readerBuffer);
                            readerBuffer = '';
                        }
                    }, 200);
                }
            }
        });
        
        // Inicializar
        updateStats();
        console.log('Sistema inicializado. Aguardando ações...');
    </script>
</body>
</html>
